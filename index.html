<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protocolo Helios: Defesa da Rede</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060913;
      color: #f2f6ff;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #game-wrap {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.22);
      border: 2px solid #2e4a76;
      border-radius: 10px;
      overflow: hidden;
      background: #0a0e1a;
    }
    canvas {
      display: block;
      width: 960px;
      height: 640px;
      max-width: 100vw;
      max-height: 88vh;
    }
    .footer-bar {
      margin-top: 10px;
      font-size: 13px;
      color: #a0b0cc;
      text-align: center;
    }
    .footer-bar strong { color: #00e5ff; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="gameCanvas" width="960" height="640"></canvas>
  </div>
  <div class="footer-bar">
    <strong>Controles:</strong> WASD / Setas (Mover) &bull; Espaço (Disparar) &bull; E (Pulso PEM 100%) &bull; P (Pausar) &bull; M (Som) &bull; Enter (Avançar)
  </div>

<script>
(() => {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const WIDTH = 960;
  const HEIGHT = 640;

  // Paleta de cores
  const COLORS = {
    BG_DEEP: "#0a0e1a",
    GRID_LINE: "#142038",
    PANEL_BG: "#0f1628",
    PANEL_BORDER: "#2e4a76",
    CYAN_NEON: "#00e5ff",
    SOLAR_GOLD: "#ffc400",
    SOLAR_ORANGE: "#ff6d00",
    EMERALD: "#00e676",
    CRIMSON: "#ff3d57",
    VIOLET: "#b388ff",
    WHITE: "#f2f6ff",
    MUTED_TEXT: "#a0b0cc"
  };

  // Textos narrativos
  const INTRO_TEXT = [
    "ANO 2142 — ESTAÇÃO ORBITAL HELIOS",
    "",
    "A rede orbital Helios abastece 80% da energia limpa da Terra",
    "através de três Reatores Solares sincronizados em órbita baixa.",
    "",
    "Uma frota autónoma corrompida — o Enxame Entrópico — iniciou",
    "um ataque coordenado para sobrecarregar os reatores e mergulhar",
    "o planeta num apagão global.",
    "",
    "Como piloto da nave intercetora AEGIS-01, a sua missão é",
    "defender os reatores, neutralizar as ondas inimigas e destruir",
    "o núcleo de comando inimigo antes que a rede entre em colapso."
  ];

  const STAGE_TRANSITIONS = {
    2: [
      "FASE 1 CONCLUÍDA — ÓRBITA BAIXA ESTABILIZADA",
      "",
      "Os primeiros batedores foram repelidos, mas os sensores",
      "detetam drones blindados com escudos de fase a aproximarem-se.",
      "Recolha cápsulas de melhoria para aumentar o poder de fogo!"
    ],
    3: [
      "FASE 2 CONCLUÍDA — ALERTA CRÍTICO DE COMANDO",
      "",
      "O núcleo central do enxame entrou no perímetro da estação:",
      "o COLOSSO ENTRÓPICO está a carregar o feixe principal.",
      "Use o Pulso PEM (tecla E) quando a barra atingir 100%!"
    ]
  };

  const VICTORY_TEXT = [
    "MISSÃO CUMPRIDA — REDE HELIOS PROTEGIDA",
    "",
    "Com a destruição do Colosso Entrópico, o sinal de corrupção",
    "foi eliminado da órbita terrestre. Os Reatores Solares voltaram",
    "à capacidade nominal e o fornecimento global foi salvo."
  ];

  const DEFEAT_TEXT = [
    "FALHA CRÍTICA — COLAPSO DA REDE HELIOS",
    "",
    "Sem defesas ativas em órbita, a sobrecarga atingiu os",
    "reatores principais. A estação entrou em modo de emergência",
    "e a Terra enfrenta um apagão energético sem precedentes."
  ];

  // Áudio sintetizado via Web Audio API
 // Áudio e trilha sonora sintetizada via Web Audio API
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
      this.step = 0;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === "suspended") {
        this.ctx.resume();
      }
      this.startMusic();
    }
    startMusic() {
      if (this.bgmTimer || !this.ctx) return;
      const bassNotes = [110, 110, 146.83, 146.83, 130.81, 130.81, 164.81, 146.83];
      const leadNotes = [440, 0, 523.25, 587.33, 659.25, 587.33, 523.25, 392.00,
                         440, 0, 523.25, 659.25, 783.99, 659.25, 587.33, 523.25];
      this.bgmTimer = setInterval(() => {
        if (this.muted || !this.ctx || this.ctx.state !== "running") return;
        const now = this.ctx.currentTime;

        // Linha de baixo pulsante
        const bassFreq = bassNotes[this.step % bassNotes.length];
        const bassOsc = this.ctx.createOscillator();
        const bassGain = this.ctx.createGain();
        bassOsc.type = "triangle";
        bassOsc.frequency.setValueAtTime(bassFreq, now);
        bassGain.gain.setValueAtTime(0.055, now);
        bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
        bassOsc.connect(bassGain);
        bassGain.connect(this.ctx.destination);
        bassOsc.start(now);
        bassOsc.stop(now + 0.21);

        // Melodia arcade espacial
        const leadFreq = leadNotes[this.step % leadNotes.length];
        if (leadFreq > 0) {
          const leadOsc = this.ctx.createOscillator();
          const leadGain = this.ctx.createGain();
          leadOsc.type = "sine";
          leadOsc.frequency.setValueAtTime(leadFreq, now);
          leadGain.gain.setValueAtTime(0.032, now);
          leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          leadOsc.connect(leadGain);
          leadGain.connect(this.ctx.destination);
          leadOsc.start(now);
          leadOsc.stop(now + 0.19);
        }
        this.step++;
      }, 220);
    }
    toggleMute() {
      this.muted = !this.muted;
      if (!this.muted) this.init();
      return this.muted;
    }
    play(type) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === "laser") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === "explosion") {
        osc.type = "square";
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.24);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        osc.start(now);
        osc.stop(now + 0.24);
      } else if (type === "powerup") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(660, now + 0.07);
        osc.frequency.setValueAtTime(880, now + 0.14);
        gain.gain.setValueAtTime(0.11, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.start(now);
        osc.stop(now + 0.22);
      } else if (type === "pem") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(1100, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.45);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      } else if (type === "hit") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }
  }
  
  const sfx = new SoundEngine();

  // Utilitários de colisão e texto
  function rectsOverlap(a, b) {
    return (
      a.x - a.w / 2 < b.x + b.w / 2 &&
      a.x + a.w / 2 > b.x - b.w / 2 &&
      a.y - a.h / 2 < b.y + b.h / 2 &&
      a.y + a.h / 2 > b.y - b.h / 2
    );
  }

  function drawRoundRect(x, y, w, h, r, fill, stroke, lineWidth = 1) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
  }

  function drawCenteredText(text, x, y, font, color) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, x, y);
  }

  // Campo estelar parallax
  class Starfield {
    constructor() {
      this.stars = [];
      for (let i = 0; i < 80; i++) {
        const layer = (i % 3) + 1;
        this.stars.push({
          x: Math.random() * WIDTH,
          y: Math.random() * HEIGHT,
          speed: layer * 26,
          size: layer
        });
      }
      this.gridOffset = 0;
    }
    update(dt) {
      this.gridOffset = (this.gridOffset + 28 * dt) % 48;
      for (const s of this.stars) {
        s.y += s.speed * dt;
        if (s.y > HEIGHT) {
          s.y = 0;
          s.x = Math.random() * WIDTH;
        }
      }
    }
    draw() {
      ctx.fillStyle = COLORS.BG_DEEP;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.strokeStyle = COLORS.GRID_LINE;
      ctx.lineWidth = 1;
      for (let x = 0; x < WIDTH; x += 48) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }
      for (let y = Math.floor(this.gridOffset); y < HEIGHT; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      for (const s of this.stars) {
        const b = 110 + s.size * 45;
        ctx.fillStyle = `rgb(${b}, ${b}, ${Math.min(255, b + 25)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Sistema de partículas e textos flutuantes
  class ParticleSystem {
    constructor() {
      this.particles = [];
      this.texts = [];
    }
    emitExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 55 + Math.random() * 175;
        this.particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.25 + Math.random() * 0.3,
          maxLife: 0.55,
          color,
          size: 2 + Math.floor(Math.random() * 4)
        });
      }
    }
    emitText(x, y, text, color) {
      this.texts.push({ x, y, text, color, life: 0.85 });
    }
    update(dt) {
      for (const p of this.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      }
      this.particles = this.particles.filter(p => p.life > 0);

      for (const t of this.texts) {
        t.y -= 34 * dt;
        t.life -= dt;
      }
      this.texts = this.texts.filter(t => t.life > 0);
    }
    draw() {
      for (const p of this.particles) {
        const ratio = Math.max(0, p.life / p.maxLife);
        const r = Math.max(1, p.size * ratio);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const t of this.texts) {
        drawCenteredText(t.text, t.x, t.y, "bold 14px 'Segoe UI', Arial", t.color);
      }
    }
  }

  // Entidades do jogo
  class Projectile {
    constructor(x, y, vx, vy, color, fromPlayer = true, damage = 1, radius = 5) {
      this.x = x;
      this.y = y;
      this.vx = vx;
      this.vy = vy;
      this.color = color;
      this.fromPlayer = fromPlayer;
      this.damage = damage;
      this.radius = radius;
      this.w = radius * 2;
      this.h = radius * 2;
      this.alive = true;
    }
    update(dt) {
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y < -30 || this.y > HEIGHT + 30 || this.x < -30 || this.x > WIDTH + 30) {
        this.alive = false;
      }
    }
    draw() {
      if (this.fromPlayer) {
        drawRoundRect(this.x - 3, this.y - 8, 6, 15, 3, this.color, null);
      } else {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(2, this.radius / 2), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  class Reactor {
    constructor(x, y, index) {
      this.x = x;
      this.y = y;
      this.w = 74;
      this.h = 34;
      this.index = index;
      this.maxHp = 100;
      this.hp = 100;
    }
    get alive() { return this.hp > 0; }
    takeDamage(amount) { this.hp = Math.max(0, this.hp - amount); }
    repair(amount) { this.hp = Math.min(this.maxHp, this.hp + amount); }
    draw() {
      const left = this.x - this.w / 2;
      const top = this.y - this.h / 2;
      if (this.alive) {
        drawRoundRect(left, top + 4, 74, 26, 6, "#183a5c", COLORS.CYAN_NEON, 2);
        ctx.fillStyle = COLORS.SOLAR_GOLD;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        drawRoundRect(left, top + 4, 74, 26, 6, "#371820", COLORS.CRIMSON, 2);
        ctx.strokeStyle = COLORS.SOLAR_ORANGE;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(left + 18, top + 8);
        ctx.lineTo(left + 56, top + 26);
        ctx.moveTo(left + 56, top + 8);
        ctx.lineTo(left + 18, top + 26);
        ctx.stroke();
      }

      // Barra de integridade
      const barY = top + this.h + 4;
      ctx.fillStyle = "#1e283c";
      ctx.fillRect(left, barY, this.w, 5);
      if (this.hp > 0) {
        ctx.fillStyle = this.hp > 50 ? COLORS.EMERALD : COLORS.SOLAR_GOLD;
        ctx.fillRect(left, barY, this.w * (this.hp / this.maxHp), 5);
      }
    }
  }

  class Player {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.w = 44;
      this.h = 48;
      this.speed = 360;
      this.maxLives = 3;
      this.lives = 3;
      this.invulnTimer = 0;
      this.shootTimer = 0;
      this.rapidTimer = 0;
      this.tripleTimer = 0;
      this.pemCharge = 40;
      this.animTimer = 0;
      this.frame = 0;
    }
    update(dt, keys) {
      let dx = 0, dy = 0;
      if (keys["ArrowLeft"] || keys["KeyA"]) dx -= 1;
      if (keys["ArrowRight"] || keys["KeyD"]) dx += 1;
      if (keys["ArrowUp"] || keys["KeyW"]) dy -= 1;
      if (keys["ArrowDown"] || keys["KeyS"]) dy += 1;

      if (dx !== 0 && dy !== 0) {
        dx *= 0.70710678;
        dy *= 0.70710678;
      }

      this.x += dx * this.speed * dt;
      this.y += dy * this.speed * dt;

      this.x = Math.max(38, Math.min(WIDTH - 38, this.x));
      this.y = Math.max(HEIGHT * 0.36 + 24, Math.min(HEIGHT - 102, this.y));

      if (this.invulnTimer > 0) this.invulnTimer = Math.max(0, this.invulnTimer - dt);
      if (this.shootTimer > 0) this.shootTimer = Math.max(0, this.shootTimer - dt);
      if (this.rapidTimer > 0) this.rapidTimer = Math.max(0, this.rapidTimer - dt);
      if (this.tripleTimer > 0) this.tripleTimer = Math.max(0, this.tripleTimer - dt);

      this.animTimer += dt;
      if (this.animTimer >= 0.08) {
        this.animTimer = 0;
        this.frame = (this.frame + 1) % 4;
      }
    }
    shoot() {
      const cooldown = this.rapidTimer > 0 ? 0.13 : 0.24;
      if (this.shootTimer > 0) return [];
      this.shootTimer = cooldown;
      const top = this.y - this.h / 2;
      if (this.tripleTimer > 0) {
        return [
          new Projectile(this.x, top, 0, -560, COLORS.CYAN_NEON, true, 1, 5),
          new Projectile(this.x - 10, top + 6, -115, -540, COLORS.SOLAR_GOLD, true, 1, 4),
          new Projectile(this.x + 10, top + 6, 115, -540, COLORS.SOLAR_GOLD, true, 1, 4)
        ];
      }
      return [new Projectile(this.x, top, 0, -560, COLORS.CYAN_NEON, true, 1, 5)];
    }
    takeDamage() {
      if (this.invulnTimer > 0) return false;
      this.lives = Math.max(0, this.lives - 1);
      this.invulnTimer = 1.6;
      return true;
    }
    draw() {
      if (this.invulnTimer > 0 && Math.floor(this.invulnTimer * 14) % 2 === 0) return;
      const ox = this.x - 24;
      const oy = this.y - 26;
      const flameLen = 8 + (this.frame % 3) * 4;

      // Propulsores
      ctx.fillStyle = COLORS.SOLAR_ORANGE;
      ctx.beginPath();
      ctx.moveTo(ox + 15, oy + 40); ctx.lineTo(ox + 19, oy + 40 + flameLen); ctx.lineTo(ox + 23, oy + 40);
      ctx.moveTo(ox + 25, oy + 40); ctx.lineTo(ox + 29, oy + 40 + flameLen); ctx.lineTo(ox + 33, oy + 40);
      ctx.fill();

      // Asas
      ctx.fillStyle = "#205c94";
      ctx.beginPath();
      ctx.moveTo(ox + 24, oy + 4);
      ctx.lineTo(ox + 4, oy + 38);
      ctx.lineTo(ox + 16, oy + 40);
      ctx.lineTo(ox + 24, oy + 32);
      ctx.lineTo(ox + 32, oy + 40);
      ctx.lineTo(ox + 44, oy + 38);
      ctx.closePath();
      ctx.fill();

      // Fuselagem central
      ctx.fillStyle = COLORS.CYAN_NEON;
      ctx.beginPath();
      ctx.moveTo(ox + 24, oy + 2);
      ctx.lineTo(ox + 14, oy + 34);
      ctx.lineTo(ox + 24, oy + 28);
      ctx.lineTo(ox + 34, oy + 34);
      ctx.closePath();
      ctx.fill();

      // Cabine
      ctx.fillStyle = COLORS.WHITE;
      ctx.beginPath();
      ctx.ellipse(ox + 24, oy + 20, 4, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      if (this.tripleTimer > 0 || this.rapidTimer > 0) {
        ctx.strokeStyle = COLORS.SOLAR_GOLD;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 29, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  class Enemy {
    constructor(x, y, kind, stage) {
      this.x = x;
      this.y = y;
      this.baseX = x;
      this.kind = kind;
      this.timeAlive = Math.random() * 4;
      this.animTimer = 0;
      this.frame = 0;
      this.alive = true;
      this.targetReactorIdx = Math.floor(Math.random() * 3);

      const speedBonus = (stage - 1) * 18;
      if (kind === "batedor") {
        this.w = 36; this.h = 36;
        this.hp = 1;
        this.speed = 115 + speedBonus;
        this.points = 100;
        this.shootTimer = 1.1 + Math.random() * 1.2;
      } else if (kind === "bombardeiro") {
        this.w = 44; this.h = 42;
        this.hp = 2;
        this.speed = 82 + speedBonus * 0.8;
        this.points = 180;
        this.shootTimer = 1.8 + Math.random() * 1.2;
      } else {
        this.w = 46; this.h = 44;
        this.hp = 3;
        this.speed = 74 + speedBonus * 0.7;
        this.points = 260;
        this.shootTimer = 1.3 + Math.random() * 0.9;
      }
    }
    update(dt, reactors) {
      this.timeAlive += dt;
      this.animTimer += dt;
      if (this.animTimer >= 0.18) {
        this.animTimer = 0;
        this.frame = (this.frame + 1) % 2;
      }
      this.y += this.speed * dt;
      if (this.kind === "batedor") {
        this.x = this.baseX + Math.sin(this.timeAlive * 3.2) * 58;
      } else if (this.kind === "bombardeiro") {
        const aliveReactors = reactors.filter(r => r.alive);
        if (aliveReactors.length > 0) {
          const target = aliveReactors[this.targetReactorIdx % aliveReactors.length];
          const diff = target.x - this.x;
          this.baseX += Math.max(-65 * dt, Math.min(65 * dt, diff * 0.8 * dt));
        }
        this.x = this.baseX;
      } else {
        this.x = this.baseX + Math.cos(this.timeAlive * 2.0) * 35;
      }
      this.x = Math.max(26, Math.min(WIDTH - 26, this.x));
    }
    tryShoot(dt, player) {
      this.shootTimer -= dt;
      if (this.shootTimer > 0 || this.y < 55 || this.y > HEIGHT - 165) return [];
      if (this.kind === "batedor") {
        this.shootTimer = 1.6 + Math.random();
        return [new Projectile(this.x, this.y + this.h / 2, 0, 290, COLORS.CRIMSON, false, 1, 5)];
      }
      if (this.kind === "escudado") {
        this.shootTimer = 1.9 + Math.random();
        const dx = player.x - this.x;
        const dy = Math.max(80, player.y - this.y);
        const dist = Math.hypot(dx, dy);
        return [new Projectile(this.x, this.y + this.h / 2, (dx / dist) * 260, (dy / dist) * 260, COLORS.VIOLET, false, 1, 5)];
      }
      this.shootTimer = 2.8;
      return [];
    }
    draw() {
      const ox = this.x - this.w / 2;
      const oy = this.y - this.h / 2;
      if (this.kind === "batedor") {
        const wing = this.frame === 0 ? 2 : -2;
        ctx.fillStyle = COLORS.CRIMSON;
        ctx.beginPath();
        ctx.moveTo(ox + 18, oy + 34);
        ctx.lineTo(ox + 2, oy + 10 + wing);
        ctx.lineTo(ox + 12, oy + 14);
        ctx.lineTo(ox + 18, oy + 4);
        ctx.lineTo(ox + 24, oy + 14);
        ctx.lineTo(ox + 34, oy + 10 + wing);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = COLORS.SOLAR_GOLD;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.kind === "bombardeiro") {
        drawRoundRect(ox + 6, oy + 8, 32, 26, 8, COLORS.SOLAR_ORANGE, null);
        drawRoundRect(ox + 10, oy + 12, 24, 18, 5, "#551e12", null);
        ctx.fillStyle = COLORS.SOLAR_GOLD;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.frame === 0 ? 6 : 8, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = COLORS.VIOLET;
        ctx.beginPath();
        ctx.moveTo(ox + 23, oy + 40);
        ctx.lineTo(ox + 4, oy + 18);
        ctx.lineTo(ox + 12, oy + 6);
        ctx.lineTo(ox + 34, oy + 6);
        ctx.lineTo(ox + 42, oy + 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = COLORS.WHITE;
        ctx.beginPath();
        ctx.arc(this.x, this.y - 2, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = this.frame === 0 ? "rgba(0,229,255,0.75)" : "rgba(0,229,255,0.35)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 20, Math.PI, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  class Boss {
    constructor() {
      this.x = WIDTH / 2;
      this.y = 118;
      this.w = 164;
      this.h = 96;
      this.maxHp = 90;
      this.hp = 90;
      this.vx = 135;
      this.attackTimer = 1.4;
      this.pattern = 0;
      this.animTimer = 0;
      this.frame = 0;
      this.alive = true;
    }
    update(dt) {
      this.animTimer += dt;
      if (this.animTimer >= 0.22) {
        this.animTimer = 0;
        this.frame = (this.frame + 1) % 2;
      }
      this.x += this.vx * dt;
      if (this.x - this.w / 2 <= 36) {
        this.x = 36 + this.w / 2;
        this.vx = Math.abs(this.vx);
      } else if (this.x + this.w / 2 >= WIDTH - 36) {
        this.x = WIDTH - 36 - this.w / 2;
        this.vx = -Math.abs(this.vx);
      }
    }
    tryAttack(dt, player) {
      this.attackTimer -= dt;
      if (this.attackTimer > 0) return [];
      this.pattern = (this.pattern + 1) % 2;
      const bottom = this.y + this.h / 2;
      const list = [];
      if (this.pattern === 0) {
        this.attackTimer = 1.5;
        for (const deg of [-36, -18, 0, 18, 36]) {
          const rad = (deg * Math.PI) / 180;
          list.push(new Projectile(this.x, bottom - 8, Math.sin(rad) * 270, Math.cos(rad) * 270, COLORS.SOLAR_ORANGE, false, 1, 6));
        }
      } else {
        this.attackTimer = 1.25;
        for (const offset of [-46, 46]) {
          const dx = player.x - (this.x + offset);
          const dy = Math.max(100, player.y - bottom);
          const dist = Math.hypot(dx, dy);
          list.push(new Projectile(this.x + offset, bottom - 10, (dx / dist) * 310, (dy / dist) * 310, COLORS.CRIMSON, false, 1, 6));
        }
      }
      return list;
    }
    draw() {
      const ox = this.x - 82;
      const oy = this.y - 48;
      ctx.fillStyle = "#5f1630";
      ctx.beginPath();
      ctx.moveTo(ox + 82, oy + 92); ctx.lineTo(ox + 10, oy + 56); ctx.lineTo(ox + 4, oy + 24);
      ctx.lineTo(ox + 36, oy + 6); ctx.lineTo(ox + 128, oy + 6); ctx.lineTo(ox + 160, oy + 24);
      ctx.lineTo(ox + 154, oy + 56);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = COLORS.CRIMSON;
      ctx.beginPath();
      ctx.moveTo(ox + 82, oy + 82); ctx.lineTo(ox + 24, oy + 50); ctx.lineTo(ox + 22, oy + 24);
      ctx.lineTo(ox + 48, oy + 12); ctx.lineTo(ox + 116, oy + 12); ctx.lineTo(ox + 142, oy + 24);
      ctx.lineTo(ox + 140, oy + 50);
      ctx.closePath();
      ctx.fill();

      drawRoundRect(ox + 26, oy + 56, 14, 22, 3, COLORS.SOLAR_ORANGE, null);
      drawRoundRect(ox + 124, oy + 56, 14, 22, 3, COLORS.SOLAR_ORANGE, null);

      ctx.fillStyle = COLORS.SOLAR_GOLD;
      ctx.beginPath();
      ctx.arc(this.x, oy + 44, this.frame === 0 ? 16 : 20, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.WHITE;
      ctx.beginPath();
      ctx.arc(this.x, oy + 44, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class PowerUp {
    constructor(x, y, kind) {
      this.x = x;
      this.y = y;
      this.w = 28;
      this.h = 28;
      this.kind = kind;
      this.vy = 125;
      this.alive = true;
    }
    update(dt) {
      this.y += this.vy * dt;
      if (this.y > HEIGHT + 20) this.alive = false;
    }
    draw() {
      const cfg = {
        triplo: [COLORS.CYAN_NEON, "T"],
        rapido: [COLORS.SOLAR_GOLD, "R"],
        reparo: [COLORS.EMERALD, "+"]
      }[this.kind];
      ctx.fillStyle = "#0f192d";
      ctx.beginPath();
      ctx.arc(this.x, this.y, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = cfg[0];
      ctx.lineWidth = 2;
      ctx.stroke();
      drawCenteredText(cfg[1], this.x, this.y + 1, "bold 15px Arial", COLORS.WHITE);
    }
  }

  // Controlador principal do jogo
  class Game {
    constructor() {
      this.starfield = new Starfield();
      this.particles = new ParticleSystem();
      this.state = "MENU"; // MENU, INTRO, PLAYING, PAUSED, TRANSITION, VICTORY, DEFEAT
      this.score = 0;
      this.highscore = Number(localStorage.getItem("protocolo_helios_highscore") || 0);
      this.stage = 1;
      this.pausedFrom = "PLAYING";
      this.keys = {};
      this.buttons = [];
      this.resetMatch();
    }

    resetMatch() {
      this.score = 0;
      this.stage = 1;
      this.player = new Player(WIDTH / 2, HEIGHT - 132);
      this.reactors = [220, 480, 740].map((x, idx) => new Reactor(x, HEIGHT - 34, idx));
      this.projectiles = [];
      this.enemies = [];
      this.powerups = [];
      this.boss = null;
      this.setupStage(1);
    }

    setupStage(stage) {
      this.stage = stage;
      this.projectiles = [];
      this.enemies = [];
      this.powerups = [];
      this.boss = null;
      this.spawnTimer = 0.8;
      this.spawnedCount = 0;
      if (stage === 1) {
        this.stageQuota = 14;
        this.spawnInterval = 1.15;
      } else if (stage === 2) {
        this.stageQuota = 20;
        this.spawnInterval = 0.92;
      } else {
        this.stageQuota = 12;
        this.spawnInterval = 1.65;
        this.boss = new Boss();
      }
    }

    saveHighscore() {
      if (this.score > this.highscore) {
        this.highscore = this.score;
        localStorage.setItem("protocolo_helios_highscore", String(this.highscore));
      }
    }

    triggerPem() {
      if (this.player.pemCharge < 100) return;
      this.player.pemCharge = 0;
      sfx.play("pem");
      this.particles.emitExplosion(this.player.x, this.player.y, COLORS.CYAN_NEON, 36);
      this.particles.emitText(WIDTH / 2, HEIGHT / 2, "PULSO PEM ATIVADO!", COLORS.CYAN_NEON);
      this.projectiles = this.projectiles.filter(p => p.fromPlayer);
      for (const enemy of this.enemies) {
        enemy.hp -= 2;
        this.particles.emitExplosion(enemy.x, enemy.y, COLORS.CYAN_NEON, 10);
        if (enemy.hp <= 0) {
          enemy.alive = false;
          this.score += enemy.points;
        }
      }
      this.enemies = this.enemies.filter(e => e.alive);
      if (this.boss && this.boss.alive) {
        this.boss.hp = Math.max(0, this.boss.hp - 16);
        this.particles.emitExplosion(this.boss.x, this.boss.y, COLORS.CYAN_NEON, 24);
        if (this.boss.hp <= 0) {
          this.boss.alive = false;
          this.score += 2500;
        }
      }
    }

    spawnEnemy() {
      const margin = 65;
      const x = margin + Math.random() * (WIDTH - margin * 2);
      const r = Math.random();
      let kind = "batedor";
      if (this.stage === 1) {
        kind = r < 0.72 ? "batedor" : "bombardeiro";
      } else if (this.stage === 2) {
        kind = r < 0.42 ? "batedor" : r < 0.78 ? "bombardeiro" : "escudado";
      } else {
        kind = r < 0.55 ? "batedor" : "escudado";
      }
      this.enemies.push(new Enemy(x, -26, kind, this.stage));
      this.spawnedCount++;
    }

    maybeDropPowerup(x, y) {
      if (Math.random() > 0.24) return;
      const kinds = ["triplo", "rapido", "reparo"];
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      this.powerups.push(new PowerUp(x, y, kind));
    }

    applyPowerup(kind) {
      sfx.play("powerup");
      if (kind === "triplo") {
        this.player.tripleTimer = 9.0;
        this.particles.emitText(this.player.x, this.player.y - 24, "DISPARO TRIPLO!", COLORS.CYAN_NEON);
      } else if (kind === "rapido") {
        this.player.rapidTimer = 9.0;
        this.particles.emitText(this.player.x, this.player.y - 24, "CADÊNCIA RÁPIDA!", COLORS.SOLAR_GOLD);
      } else {
        const damaged = this.reactors.filter(r => r.hp < r.maxHp);
        if (damaged.length > 0) {
          damaged.sort((a, b) => a.hp - b.hp);
          damaged[0].repair(35);
          this.particles.emitText(damaged[0].x, damaged[0].y - 22, "+35 ENERGIA", COLORS.EMERALD);
        } else {
          this.score += 300;
          this.particles.emitText(this.player.x, this.player.y - 24, "+300 BÓNUS", COLORS.EMERALD);
        }
      }
    }

    updatePlaying(dt) {
      this.player.update(dt, this.keys);
      if (this.keys["Space"]) {
        const shots = this.player.shoot();
        if (shots.length > 0) {
          sfx.play("laser");
          this.projectiles.push(...shots);
        }
      }

      if (this.spawnedCount < this.stageQuota) {
        this.spawnTimer -= dt;
        if (this.spawnTimer <= 0) {
          this.spawnEnemy();
          this.spawnTimer = this.spawnInterval;
        }
      }

      for (const proj of this.projectiles) proj.update(dt);

      for (const enemy of this.enemies) {
        enemy.update(dt, this.reactors);
        this.projectiles.push(...enemy.tryShoot(dt, this.player));
        if (enemy.y + enemy.h / 2 >= HEIGHT - 54) {
          enemy.alive = false;
          const aliveReactors = this.reactors.filter(r => r.alive);
          if (aliveReactors.length > 0) {
            aliveReactors.sort((a, b) => Math.abs(a.x - enemy.x) - Math.abs(b.x - enemy.x));
            aliveReactors[0].takeDamage(28);
            sfx.play("hit");
            this.particles.emitExplosion(aliveReactors[0].x, aliveReactors[0].y, COLORS.SOLAR_ORANGE, 14);
          }
        }
      }

      if (this.boss && this.boss.alive) {
        this.boss.update(dt);
        this.projectiles.push(...this.boss.tryAttack(dt, this.player));
      }

      for (const pw of this.powerups) {
        pw.update(dt);
        if (pw.alive && rectsOverlap(pw, this.player)) {
          pw.alive = false;
          this.applyPowerup(pw.kind);
        }
      }

      // Colisões de projéteis
      for (const proj of this.projectiles) {
        if (!proj.alive) continue;
        if (proj.fromPlayer) {
          for (const enemy of this.enemies) {
            if (enemy.alive && rectsOverlap(proj, enemy)) {
              proj.alive = false;
              enemy.hp -= proj.damage;
              this.particles.emitExplosion(proj.x, proj.y, COLORS.CYAN_NEON, 5);
              if (enemy.hp <= 0) {
                enemy.alive = false;
                this.score += enemy.points;
                this.player.pemCharge = Math.min(100, this.player.pemCharge + 12);
                sfx.play("explosion");
                this.particles.emitExplosion(enemy.x, enemy.y, COLORS.SOLAR_GOLD, 16);
                this.particles.emitText(enemy.x, enemy.y, `+${enemy.points}`, COLORS.WHITE);
                this.maybeDropPowerup(enemy.x, enemy.y);
              }
              break;
            }
          }
          if (proj.alive && this.boss && this.boss.alive && rectsOverlap(proj, this.boss)) {
            proj.alive = false;
            this.boss.hp = Math.max(0, this.boss.hp - proj.damage);
            this.player.pemCharge = Math.min(100, this.player.pemCharge + 3);
            this.particles.emitExplosion(proj.x, proj.y, COLORS.SOLAR_ORANGE, 6);
            if (this.boss.hp <= 0) {
              this.boss.alive = false;
              this.score += 2500;
              sfx.play("explosion");
              this.particles.emitExplosion(this.boss.x, this.boss.y, COLORS.SOLAR_GOLD, 45);
            }
          }
        } else {
          if (rectsOverlap(proj, this.player)) {
            proj.alive = false;
            if (this.player.takeDamage()) {
              sfx.play("hit");
              this.particles.emitExplosion(this.player.x, this.player.y, COLORS.CRIMSON, 18);
              this.particles.emitText(this.player.x, this.player.y - 20, "-1 INTEGRIDADE", COLORS.CRIMSON);
            }
          } else {
            for (const reactor of this.reactors) {
              if (reactor.alive && rectsOverlap(proj, reactor)) {
                proj.alive = false;
                reactor.takeDamage(14);
                sfx.play("hit");
                this.particles.emitExplosion(proj.x, proj.y, COLORS.SOLAR_ORANGE, 8);
                break;
              }
            }
          }
        }
      }

      for (const enemy of this.enemies) {
        if (enemy.alive && rectsOverlap(enemy, this.player)) {
          enemy.alive = false;
          this.particles.emitExplosion(enemy.x, enemy.y, COLORS.CRIMSON, 14);
          if (this.player.takeDamage()) sfx.play("hit");
        }
      }

      this.projectiles = this.projectiles.filter(p => p.alive);
      this.enemies = this.enemies.filter(e => e.alive);
      this.powerups = this.powerups.filter(p => p.alive);
      this.particles.update(dt);

      const reactorsAlive = this.reactors.filter(r => r.alive).length;
      if (this.player.lives <= 0 || reactorsAlive === 0) {
        this.saveHighscore();
        this.state = "DEFEAT";
        return;
      }

      const stageCleared =
        this.spawnedCount >= this.stageQuota &&
        this.enemies.length === 0 &&
        (!this.boss || !this.boss.alive);

      if (stageCleared) {
        this.score += reactorsAlive * 250;
        if (this.stage < 3) {
          this.setupStage(this.stage + 1);
          this.state = "TRANSITION";
        } else {
          this.saveHighscore();
          this.state = "VICTORY";
        }
      }
    }

    drawButton(x, y, w, h, label, accent = COLORS.CYAN_NEON, onClick = null) {
      const hovered = this.mouseX >= x && this.mouseX <= x + w && this.mouseY >= y && this.mouseY <= y + h;
      drawRoundRect(x, y, w, h, 8, hovered ? "#1c2d50" : COLORS.PANEL_BG, hovered ? COLORS.SOLAR_GOLD : accent, 2);
      drawCenteredText(label, x + w / 2, y + h / 2, "bold 17px 'Segoe UI', Arial", COLORS.WHITE);
      if (onClick) this.buttons.push({ x, y, w, h, onClick });
    }

    drawHud() {
      ctx.fillStyle = "rgba(15, 22, 40, 0.92)";
      ctx.fillRect(0, 0, WIDTH, 46);
      ctx.strokeStyle = COLORS.PANEL_BORDER;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 46);
      ctx.lineTo(WIDTH, 46);
      ctx.stroke();

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.font = "bold 16px 'Segoe UI', Arial";
      ctx.fillStyle = COLORS.WHITE;
      ctx.fillText(`PONTOS: ${String(this.score).padStart(6, "0")}`, 18, 23);

      ctx.font = "14px 'Segoe UI', Arial";
      ctx.fillStyle = COLORS.MUTED_TEXT;
      ctx.fillText(`RECORDE: ${String(this.highscore).padStart(6, "0")}`, 195, 23);

      drawCenteredText(`FASE ${this.stage}/3`, WIDTH / 2 - 40, 23, "bold 16px 'Segoe UI', Arial", COLORS.SOLAR_GOLD);

      // Barra PEM
      const pemReady = this.player.pemCharge >= 100;
      const pemColor = pemReady ? COLORS.CYAN_NEON : "#4678a0";
      ctx.font = "bold 13px 'Segoe UI', Arial";
      ctx.fillStyle = pemColor;
      ctx.fillText(pemReady ? "PEM [E] PRONTO!" : "PEM:", 545, 23);
      ctx.fillStyle = "#1e2a44";
      ctx.fillRect(665, 16, 95, 14);
      ctx.fillStyle = pemColor;
      ctx.fillRect(665, 16, 95 * (this.player.pemCharge / 100), 14);

      // Vidas
      ctx.fillStyle = COLORS.EMERALD;
      ctx.fillText("NAVE:", 780, 23);
      for (let i = 0; i < this.player.maxLives; i++) {
        ctx.fillStyle = i < this.player.lives ? COLORS.EMERALD : "#323c50";
        ctx.fillRect(832 + i * 24, 16, 18, 14);
      }

      if (this.boss && this.boss.alive) {
        const bw = 380, bx = (WIDTH - bw) / 2, by = 56;
        drawRoundRect(bx - 4, by - 4, bw + 8, 22, 6, COLORS.PANEL_BG, COLORS.CRIMSON, 1.5);
        ctx.fillStyle = COLORS.CRIMSON;
        ctx.fillRect(bx, by, bw * (this.boss.hp / this.boss.maxHp), 14);
        drawCenteredText(`COLOSSO ENTRÓPICO — ${this.boss.hp}/${this.boss.maxHp}`, WIDTH / 2, by + 7, "bold 12px Arial", COLORS.WHITE);
      }
    }

    drawNarrativeBox(title, lines, titleColor, btnLabel, onContinue) {
      drawRoundRect(110, 74, WIDTH - 220, HEIGHT - 150, 14, COLORS.PANEL_BG, COLORS.PANEL_BORDER, 2);
      drawCenteredText(title, WIDTH / 2, 118, "bold 28px 'Segoe UI', Arial", titleColor);
      let y = 166;
      for (const line of lines) {
        if (line === "") {
          y += 14;
        } else {
          drawCenteredText(line, WIDTH / 2, y, "16px 'Segoe UI', Arial", COLORS.WHITE);
          y += 26;
        }
      }
      this.drawButton(WIDTH / 2 - 140, HEIGHT - 142, 280, 44, btnLabel, titleColor, onContinue);
    }

    draw() {
      this.buttons = [];
      this.starfield.draw();

      if (this.state === "MENU") {
        drawRoundRect(150, 78, WIDTH - 300, HEIGHT - 156, 16, COLORS.PANEL_BG, COLORS.PANEL_BORDER, 2);
        drawCenteredText("PROTOCOLO HELIOS", WIDTH / 2, 142, "bold 40px 'Segoe UI', Arial", COLORS.CYAN_NEON);
        drawCenteredText("DEFESA DA REDE ORBITAL", WIDTH / 2, 182, "bold 18px 'Segoe UI', Arial", COLORS.SOLAR_GOLD);
        drawCenteredText(`RECORDE ATUAL: ${String(this.highscore).padStart(6, "0")} PTS`, WIDTH / 2, 224, "16px 'Segoe UI', Arial", COLORS.EMERALD);

        this.drawButton(WIDTH / 2 - 135, 268, 270, 48, "INICIAR MISSÃO", COLORS.CYAN_NEON, () => {
          sfx.init();
          this.resetMatch();
          this.state = "INTRO";
        });
        this.drawButton(WIDTH / 2 - 135, 332, 270, 46, "HISTÓRIA E OBJETIVO", COLORS.SOLAR_GOLD, () => {
          sfx.init();
          this.state = "INTRO";
        });
        this.drawButton(WIDTH / 2 - 135, 394, 270, 46, `SOM: ${sfx.muted ? "DESATIVADO" : "ATIVADO"}`, COLORS.EMERALD, () => {
          sfx.toggleMute();
        });

        drawCenteredText("Mover: WASD / Setas  |  Disparar: Espaço  |  Pulso PEM: E  |  Pausar: P", WIDTH / 2, 474, "14px 'Segoe UI', Arial", COLORS.MUTED_TEXT);
        drawCenteredText("Projeto A3 — Gabriel Osório, André Oliveira & Carlos Rodrigues", WIDTH / 2, 502, "13px 'Segoe UI', Arial", COLORS.MUTED_TEXT);
      } else if (this.state === "INTRO") {
        this.drawNarrativeBox("BRIEFING DA MISSÃO", INTRO_TEXT, COLORS.CYAN_NEON, "INICIAR COMBATE (ENTER)", () => {
          this.resetMatch();
          this.state = "PLAYING";
        });
      } else if (this.state === "TRANSITION") {
        this.drawNarrativeBox(`SETOR ${this.stage} DESBLOQUEADO`, STAGE_TRANSITIONS[this.stage], COLORS.SOLAR_GOLD, "CONTINUAR (ENTER)", () => {
          this.state = "PLAYING";
        });
      } else if (this.state === "VICTORY") {
        const lines = [...VICTORY_TEXT, "", `PONTUAÇÃO FINAL: ${this.score}   |   RECORDE: ${this.highscore}`];
        this.drawNarrativeBox("VITÓRIA ORBITAL!", lines, COLORS.EMERALD, "VOLTAR AO MENU", () => {
          this.state = "MENU";
        });
      } else if (this.state === "DEFEAT") {
        const lines = [...DEFEAT_TEXT, "", `PONTUAÇÃO FINAL: ${this.score}   |   RECORDE: ${this.highscore}`];
        this.drawNarrativeBox("DERROTA — REDE COMPROMETIDA", lines, COLORS.CRIMSON, "TENTAR NOVAMENTE", () => {
          this.resetMatch();
          this.state = "PLAYING";
        });
      } else {
        // Estado PLAYING ou PAUSED
        ctx.strokeStyle = "rgba(46, 74, 118, 0.55)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(20, HEIGHT - 72);
        ctx.lineTo(WIDTH - 20, HEIGHT - 72);
        ctx.stroke();

        for (const r of this.reactors) r.draw();
        for (const pw of this.powerups) pw.draw();
        for (const p of this.projectiles) p.draw();
        for (const e of this.enemies) e.draw();
        if (this.boss && this.boss.alive) this.boss.draw();
        this.player.draw();
        this.particles.draw();
        this.drawHud();

        if (this.state === "PAUSED") {
          ctx.fillStyle = "rgba(6, 9, 19, 0.72)";
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          drawRoundRect(WIDTH / 2 - 190, HEIGHT / 2 - 130, 380, 260, 14, COLORS.PANEL_BG, COLORS.CYAN_NEON, 2);
          drawCenteredText("JOGO PAUSADO", WIDTH / 2, HEIGHT / 2 - 80, "bold 28px 'Segoe UI', Arial", COLORS.CYAN_NEON);
          this.drawButton(WIDTH / 2 - 125, HEIGHT / 2 - 28, 250, 44, "RETOMAR (P)", COLORS.EMERALD, () => {
            this.state = "PLAYING";
          });
          this.drawButton(WIDTH / 2 - 125, HEIGHT / 2 + 32, 250, 44, "MENU PRINCIPAL", COLORS.CRIMSON, () => {
            this.state = "MENU";
          });
        }
      }
    }
  }

  const game = new Game();
  game.mouseX = 0;
  game.mouseY = 0;

  window.addEventListener("keydown", (e) => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
      e.preventDefault();
    }
    game.keys[e.code] = true;

    if (e.code === "KeyM") {
      sfx.toggleMute();
    } else if (e.code === "KeyP" && (game.state === "PLAYING" || game.state === "PAUSED")) {
      game.state = game.state === "PLAYING" ? "PAUSED" : "PLAYING";
    } else if (e.code === "KeyE" && game.state === "PLAYING") {
      game.triggerPem();
    } else if (e.code === "Enter") {
      if (game.state === "MENU") {
        sfx.init();
        game.resetMatch();
        game.state = "INTRO";
      } else if (game.state === "INTRO") {
        game.resetMatch();
        game.state = "PLAYING";
      } else if (game.state === "TRANSITION") {
        game.state = "PLAYING";
      } else if (game.state === "VICTORY" || game.state === "DEFEAT") {
        game.state = "MENU";
      }
    }
  });

  window.addEventListener("keyup", (e) => {
    game.keys[e.code] = false;
  });

  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    game.mouseX = (e.clientX - rect.left) * (WIDTH / rect.width);
    game.mouseY = (e.clientY - rect.top) * (HEIGHT / rect.height);
  });

  canvas.addEventListener("mousedown", (e) => {
    sfx.init();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (WIDTH / rect.width);
    const my = (e.clientY - rect.top) * (HEIGHT / rect.height);
    for (const btn of game.buttons) {
      if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
        btn.onClick();
        break;
      }
    }
  });

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    if (game.state !== "PAUSED") {
      game.starfield.update(dt);
    }
    if (game.state === "PLAYING") {
      game.updatePlaying(dt);
    }
    game.draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
